services:
  flask:
    build: .
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
    networks:
      - custom-network
    volumes:
      - shared_log:/app/logs/
  worker:
    build: .
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
    command: ["python","watchdog.py"]
    networks:
      - custom-network
    volumes:
      - shared_log:/app/logs/
  redis:
    image: redis:7-alpine
    networks:
      - custom-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - custom-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
networks:
  custom-network:
    driver: bridge
volumes:
  shared_log: