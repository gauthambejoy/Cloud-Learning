services:
  flask:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    networks:
      - custom-network
    volumes:
      - shared_log:/app/logs/
    restart: unless-stopped
  worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    command: ["python","watchdog.py"]
    networks:
      - custom-network
    volumes:
      - shared_log:/app/logs/
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    networks:
      - custom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - custom-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped
networks:
  custom-network:
    driver: bridge
volumes:
  shared_log: